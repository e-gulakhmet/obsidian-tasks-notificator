[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-tasks-notificator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "isodate>=0.6.1",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "httpx>=0.27",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["notificator"]
